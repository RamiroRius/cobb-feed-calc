<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de alimentación</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          indigo: {
            50: '#EEF2FF', 100: '#E0E7FF', 500: '#6366F1', 600: '#4F46E5', 700: '#4338CA',
          },
        },
        fontFamily: { sans: ['Inter', 'sans-serif'] },
      },
    },
  };
</script>
<style>
  body { background-color: #F8F9FC; }
  .card { box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06); }
  .tnum { font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="min-h-screen font-sans text-slate-800">

  <div class="flex min-h-screen">
    <!-- Main -->
    <div class="flex-1 p-6 md:p-8 max-w-6xl mx-auto w-full">

      <header class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-2xl font-bold text-slate-900">Panel de alimentación</h1>
          <p class="text-sm text-slate-500 mt-0.5">Calculá el consumo diario y el alimento restante del lote</p>
        </div>
      </header>

      <!-- Formulario -->
      <div class="bg-white rounded-2xl card border border-slate-100 p-6 mb-6">
        <h2 class="text-sm font-semibold text-slate-700 mb-4">Datos del lote</h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label for="cantidadPollos" class="block text-xs font-medium text-slate-500 mb-1.5">Cantidad de pollos</label>
            <input type="number" id="cantidadPollos" value="100"
              class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm tnum focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 outline-none transition">
          </div>
          <div>
            <label for="mortalidad" class="block text-xs font-medium text-slate-500 mb-1.5">Mortalidad (aves)</label>
            <input type="number" id="mortalidad" value="0"
              class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm tnum focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 outline-none transition">
          </div>
          <div>
            <label for="edad" class="block text-xs font-medium text-slate-500 mb-1.5">Edad (días)</label>
            <input type="number" id="edad" value="1"
              class="w-full border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm tnum focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 outline-none transition">
          </div>
        </div>
        <button onclick="calcular()"
          class="mt-5 inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition-colors shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          Calcular alimento
        </button>
      </div>

      <!-- Stat cards -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
        <div class="bg-white rounded-2xl card border border-slate-100 p-6">
          <div class="flex items-center justify-between mb-3">
            <p class="text-xs font-medium text-slate-500">Comida del día</p>
            <div class="w-9 h-9 rounded-lg bg-indigo-50 flex items-center justify-center">
              <svg class="w-4.5 h-4.5 text-indigo-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V6m0 10v2m0-14a9 9 0 100 18 9 9 0 000-18z"/></svg>
            </div>
          </div>
          <div class="flex items-baseline gap-1.5">
            <span id="comidaDia" class="text-3xl font-bold text-slate-900 tnum">–</span>
            <span class="text-sm text-slate-400">kg</span>
          </div>
        </div>

        <div class="bg-white rounded-2xl card border border-slate-100 p-6">
          <div class="flex items-center justify-between mb-3">
            <p class="text-xs font-medium text-slate-500">Días proyectados</p>
            <div class="w-9 h-9 rounded-lg bg-indigo-50 flex items-center justify-center">
              <svg class="w-4.5 h-4.5 text-indigo-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            </div>
          </div>
          <div class="flex items-baseline gap-1.5">
            <span id="diasProyectados" class="text-3xl font-bold text-slate-900 tnum">–</span>
            <span class="text-sm text-slate-400">días</span>
          </div>
        </div>
      </div>

      <!-- Tabla -->
      <div class="bg-white rounded-2xl card border border-slate-100 overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100">
          <h2 class="text-sm font-semibold text-slate-700">Comida total restante</h2>
          <p class="text-xs text-slate-400 mt-0.5">Detalle de consumo proyectado por día</p>
        </div>
        <table class="w-full text-sm">
          <thead>
            <tr class="bg-slate-50 text-left text-xs font-medium text-slate-500">
              <th class="px-6 py-2.5">Día</th>
              <th class="px-6 py-2.5">Consumo (kg)</th>
            </tr>
          </thead>
          <tbody id="comidaTotal" class="divide-y divide-slate-100">
            <tr>
              <td colspan="2" class="px-6 py-8 text-center text-slate-400">Sin datos aún. Calculá para ver el detalle.</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

<script>
    const socket = io();

    function calcular() {
        const cantidadPollos = document.getElementById("cantidadPollos").value;
        const mortalidad = document.getElementById("mortalidad").value;
        const edad = document.getElementById("edad").value;

        socket.emit("calcular", {
            cantidadPollos: cantidadPollos,
            mortalidad: mortalidad,
            edad: edad
        });
    }

    socket.on("resultado_calculo", (data) => {
        document.getElementById("comidaDia").innerText = data.comidaDia;
        document.getElementById("diasProyectados").innerText = data.comidaPorDia.length;

        const tbody = document.getElementById("comidaTotal");
        tbody.innerHTML = "";

        data.comidaPorDia.forEach((valor, i) => {
            const tr = document.createElement("tr");
            tr.className = "hover:bg-slate-50/60 transition-colors";
            tr.innerHTML = `
                <td class="px-6 py-2.5 text-slate-500 tnum">${i + 1}</td>
                <td class="px-6 py-2.5 font-medium text-slate-800 tnum">${valor}</td>
            `;
            tbody.appendChild(tr);
        });
    });
</script>
</body>
</html>
